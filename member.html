<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anggota - KAS FAM RF</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="wrap narrow"><div class="logo">KAS <b>FAM RF</b></div><div class="card"><h2>Login Anggota</h2><input id="icLogin" placeholder="Nama IC"><input id="waLogin" placeholder="No WhatsApp"><button class="btn pink" onclick="loginMember()">Masuk</button><p class="muted">Tanpa email, password, dan OTP.</p><a href="index.html">← Kembali</a></div></div>
<div id="app" class="hidden"><header><div class="logo" style="font-size:22px">KAS <b>FAM RF</b></div><button class="btn tiny dark" onclick="logout()">Keluar</button></header><main class="wrap"><h2 id="name"></h2><div class="grid"><div class="money"><small>Saldo</small><b id="bal" class="green">R0k</b></div><div class="money"><small>Tunggakan</small><b id="arr" class="red">R1k</b></div></div>
<div class="tabs"><button onclick="show('profile')">Profile</button><button onclick="show('pending')">Pending</button><button onclick="show('kas')">Kas</button><button onclick="show('questions')">Pertanyaan</button></div>
<section id="profile" class="card"><b>Profile</b><p id="phone"></p><p class="muted">Akun terikat ke 1 perangkat aktif.</p></section>
<section id="pending" class="hidden"><div id="pendingList"></div></section>
<section id="kas" class="hidden"><div class="card"><h3>Bayar Kas</h3><input id="amount" type="number" min="1000" step="1000" placeholder="Nominal contoh 2000"><input id="proof" type="file" accept="image/*"><button class="btn pink" onclick="pay()">Kirim Pembayaran</button></div><div id="history"></div></section>
<section id="questions" class="hidden"><div class="card"><h3>Pertanyaan</h3><textarea id="question" placeholder="Tulis pertanyaan"></textarea><button class="btn pink" onclick="ask()">Kirim</button></div><div id="qa"></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let me,token,deviceId;const fmt=n=>"R"+Math.round(Number(n||0)/1000)+"k";const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
deviceId=localStorage.getItem("fam_device_id")||crypto.randomUUID();localStorage.setItem("fam_device_id",deviceId);
async function loginMember(){let r=await sb.rpc("member_login",{p_name:icLogin.value,p_whatsapp:waLogin.value,p_device_id:deviceId});if(r.error||!r.data?.ok)return alert(r.data?.error||r.error?.message);token=r.data.token;me=r.data.member;save();await charge();openApp()}
function save(){localStorage.setItem("fam_member_session",JSON.stringify({id:me.id,token,deviceId}))}
async function charge(){let r=await sb.rpc("charge_today",{p_member_id:me.id});if(r.data?.member){me=r.data.member;save()}}
async function refresh(){let r=await sb.rpc("member_refresh",{p_member_id:me.id,p_token:token});if(r.error||!r.data?.ok){localStorage.removeItem("fam_member_session");location.reload();return false}me=r.data.member;await charge();return true}
function openApp(){login.classList.add("hidden");app.classList.remove("hidden");render();loadPayments();loadQuestions()}
function render(){name.textContent=me.ic_name;phone.textContent="WhatsApp: "+me.whatsapp;bal.textContent=fmt(me.balance);arr.textContent=fmt(me.arrears)}
function show(x){["profile","pending","kas","questions"].forEach(i=>document.getElementById(i).classList.toggle("hidden",i!==x));if(x==="pending"||x==="kas")loadPayments();if(x==="questions")loadQuestions()}
async function pay(){let a=Number(amount.value),f=proof.files[0];if(!a||a<1000)return alert("Nominal minimal R1k");let path=null;if(f){path=me.id+"/"+Date.now()+"_"+f.name;let u=await sb.storage.from("payment-proofs").upload(path,f);if(u.error)return alert(u.error.message)}let r=await sb.from("payments").insert({member_id:me.id,amount:a,proof_path:path});if(r.error)return alert(r.error.message);alert("Pembayaran dikirim. Menunggu persetujuan admin.");amount.value="";proof.value="";loadPayments()}
async function loadPayments(){let r=await sb.from("payments").select("*").eq("member_id",me.id).order("created_at",{ascending:false});let d=r.data||[];pendingList.innerHTML=d.filter(x=>x.status==="pending").map(x=>`<div class="card">Pembayaran ${fmt(x.amount)} — <span class="yellow">PENDING</span></div>`).join("")||'<div class="card muted">Tidak ada pending.</div>';history.innerHTML=d.map(x=>`<div class="card">Pembayaran ${fmt(x.amount)} — ${x.status}</div>`).join("")}
async function ask(){let q=question.value.trim();if(!q)return;let r=await sb.from("questions").insert({member_id:me.id,question:q});if(r.error)return alert(r.error.message);question.value="";loadQuestions()}
async function loadQuestions(){let r=await sb.from("questions").select("*").eq("member_id",me.id).order("created_at",{ascending:false});qa.innerHTML=(r.data||[]).map(x=>`<div class="card"><b>${esc(x.question)}</b><p>${esc(x.answer||"Menunggu jawaban admin...")}</p></div>`).join("")}
async function logout(){await sb.rpc("member_logout",{p_member_id:me.id,p_token:token});localStorage.removeItem("fam_member_session");location.reload()}
(async()=>{let s=localStorage.getItem("fam_member_session");if(s){try{let x=JSON.parse(s);deviceId=x.deviceId;token=x.token;me={id:x.id};if(await refresh())openApp()}catch{localStorage.removeItem("fam_member_session")}}})();
</script></body></html>
