<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - KAS FAM RF</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="wrap narrow"><div class="logo">ADMIN <b>KAS FAM RF</b></div><div class="card"><h2>Login Admin</h2><input id="un" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button class="btn pink" onclick="adminLogin()">Masuk</button><a href="index.html">← Kembali</a></div></div>
<div id="app" class="hidden"><header><div class="logo" style="font-size:22px">KAS <b>FAM RF</b></div><button class="btn tiny dark" onclick="logout()">Keluar</button></header><main class="wrap"><div class="tabs"><button onclick="show('dashboard')">Dashboard</button><button onclick="show('members')">Anggota</button><button onclick="show('payments')">Pembayaran</button><button onclick="show('questions')">Pertanyaan</button></div>
<section id="dashboard"><div class="grid"><div class="money"><small>Total anggota</small><b id="mc">0</b></div><div class="money"><small>Pending</small><b id="pc">0</b></div></div></section>
<section id="members" class="hidden"><div class="card"><h3>Buat Akun Anggota</h3><input id="ic" placeholder="Nama IC"><input id="wa" placeholder="No WhatsApp"><button class="btn pink" onclick="createMember()">Buat Akun</button></div><div id="memberList"></div></section>
<section id="payments" class="hidden"><div id="paymentList"></div></section><section id="questions" class="hidden"><div id="questionList"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const fmt=n=>"R"+Math.round(Number(n||0)/1000)+"k";const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function adminLogin(){let r=await sb.rpc("admin_login",{p_username:un.value,p_password:pw.value});if(r.error||!r.data?.ok)return alert(r.data?.error||r.error?.message);localStorage.setItem("fam_admin",un.value);login.classList.add("hidden");app.classList.remove("hidden");load()}
function show(x){["dashboard","members","payments","questions"].forEach(i=>document.getElementById(i).classList.toggle("hidden",i!==x))}
async function createMember(){let r=await sb.rpc("create_member",{p_name:ic.value,p_whatsapp:wa.value});if(r.error||!r.data?.ok)return alert(r.data?.error||r.error?.message);alert("Akun dibuat.");ic.value="";wa.value="";load()}
async function block(id,v){let r=await sb.from("members").update({blocked:v,active:!v}).eq("id",id);if(r.error)return alert(r.error.message);if(v)await sb.from("member_sessions").delete().eq("member_id",id);load()}
async function removeMember(id){if(!confirm("Hapus akun anggota beserta data kasnya?"))return;let r=await sb.from("members").delete().eq("id",id);if(r.error)return alert(r.error.message);load()}
async function review(id,status){let r=await sb.rpc("apply_payment",{p_payment_id:id,p_status:status,p_admin:localStorage.getItem("fam_admin")});if(r.error||!r.data?.ok)return alert(r.data?.error||r.error?.message);load()}
async function answer(id){let a=document.getElementById("a"+id).value.trim();if(!a)return;await sb.rpc("admin_answer",{p_id:id,p_answer:a,p_admin:localStorage.getItem("fam_admin")});load()}
async function load(){let m=(await sb.from("members").select("*").order("created_at",{ascending:false})).data||[];mc.textContent=m.length;memberList.innerHTML=m.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.ic_name)}</b><div class="muted">${esc(x.whatsapp)}</div></div><span class="badge ${x.blocked?'red':'green'}">${x.blocked?'DIBLOKIR':'AKTIF'}</span></div><p>Saldo <span class="green">${fmt(x.balance)}</span> • Tunggakan <span class="red">${fmt(x.arrears)}</span></p><div><button class="btn ${x.blocked?'ok':'danger'}" onclick="block('${x.id}',${!x.blocked})">${x.blocked?'Buka Blokir':'Blokir'}</button><button class="btn dark" onclick="removeMember('${x.id}')">Hapus Akun</button></div></div>`).join("")||'<div class="card muted">Belum ada anggota.</div>';
let s=(await sb.from("member_sessions").select("member_id")).data||[];let active=new Set(s.map(x=>x.member_id));document.querySelectorAll("#memberList .card").forEach((el,i)=>{if(m[i]&&active.has(m[i].id))el.querySelector(".row").insertAdjacentHTML("beforeend",'<span class="badge yellow">SEDANG LOGIN</span>')});
let p=(await sb.from("payments").select("*,members(ic_name,whatsapp)").order("created_at",{ascending:false})).data||[];pc.textContent=p.filter(x=>x.status==="pending").length;paymentList.innerHTML=p.map(x=>`<div class="card"><b>${esc(x.members?.ic_name||"-")}</b><p>${fmt(x.amount)} — ${x.status}</p>${x.proof_path?`<a target="_blank" href="${SUPABASE_URL}/storage/v1/object/public/payment-proofs/${x.proof_path.split('/').map(encodeURIComponent).join('/')}">📷 Lihat Bukti</a>`:""}${x.status==="pending"?`<div><button class="btn pink" onclick="review('${x.id}','approved')">Setujui</button><button class="btn dark" onclick="review('${x.id}','rejected')">Tolak</button></div>`:""}</div>`).join("")||'<div class="card muted">Belum ada pembayaran.</div>';
let q=(await sb.from("questions").select("*").order("created_at",{ascending:false})).data||[];questionList.innerHTML=q.map(x=>`<div class="card"><p>${esc(x.question)}</p>${x.status==="pending"?`<textarea id="a${x.id}" placeholder="Jawaban"></textarea><button class="btn pink" onclick="answer('${x.id}')">Jawab</button>`:`<p>${esc(x.answer)}</p>`}</div>`).join("")}
function logout(){localStorage.removeItem("fam_admin");location.href="admin.html"}if(localStorage.getItem("fam_admin")){login.classList.add("hidden");app.classList.remove("hidden");load()}
</script></body></html>
