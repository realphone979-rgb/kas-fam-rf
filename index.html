<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - KAS FAM RF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #111827;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #pesan {
      text-align: center;
      margin-top: 15px;
      color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Login Admin</h2>

    <input
      type="text"
      id="username"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn" onclick="login()">
      LOGIN
    </button>

    <div id="pesan"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://kasfamrf-harian.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_51ErC97x1gHqfukpdfJ3Ow_uGFB83";

    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const tombol = document.getElementById("loginBtn");
      const pesan = document.getElementById("pesan");

      pesan.textContent = "";

      if (!username || !password) {
        pesan.textContent = "Username dan password wajib diisi.";
        return;
      }

      tombol.disabled = true;
      tombol.textContent = "Memeriksa...";

      try {
        const response = await fetch(
          SUPABASE_URL + "/rest/v1/rpc/admin_login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY,
              "Authorization": "Bearer " + SUPABASE_ANON_KEY
            },
            body: JSON.stringify({
              p_username: username,
              p_password: password
            })
          }
        );

        const data = await response.json();

        if (response.ok && data.ok === true) {
          localStorage.setItem("admin_login", "true");
          localStorage.setItem("admin_username", data.username);

          window.location.href = "admin.html";
        } else {
          pesan.textContent = "Username atau password salah.";
        }

      } catch (error) {
        console.error(error);
        pesan.textContent = "Gagal terhubung ke server.";
      }

      tombol.disabled = false;
      tombol.textContent = "LOGIN";
    }
  </script>

</body>
</html>
